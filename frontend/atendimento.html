<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento - Saúde Integra</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="container">


    <header class="topo">

        <div>

            <h2>📝 Atendimento</h2>

            <p>
                Cadastro de pacientes
            </p>

        </div>

        <a
            href="index.html"
            class="btn-voltar"
        >
            ← Voltar
        </a>

    </header>


    <nav class="menu">

        <a href="index.html">
            🏠 Início
        </a>

        <a href="atendimento.html">
            📝 Atendimento
        </a>

        <a href="triagem.html">
            🩺 Triagem
        </a>

        <a href="medico.html">
            👨‍⚕️ Médico
        </a>

        <a href="medicacoes.html">
            💊 Medicações
        </a>

        <a href="alta.html">
            📋 Alta
        </a>

        <a href="tv.html">
            📺 Painel TV
        </a>

    </nav>


    <div class="card">

        <h3>
            👤 Cadastro de paciente
        </h3>


        <label>
            Nome completo
        </label>

        <input
            id="nome"
            type="text"
            placeholder="Digite o nome completo"
        >


        <label>
            CPF
        </label>

        <input
            id="cpf"
            type="text"
            placeholder="Digite o CPF"
        >


        <label>
            Tipo de atendimento
        </label>

        <select id="tipo">

            <option value="">
                Selecione
            </option>

            <option value="Normal">
                Normal
            </option>

            <option value="Preferencial">
                Preferencial
            </option>

            <option value="Emergência">
                Emergência
            </option>

        </select>


        <button onclick="salvarPaciente()">

            💾 Cadastrar paciente

        </button>


        <div id="resultado"></div>

    </div>


    <div class="card">

        <h3>
            👥 Pacientes cadastrados
        </h3>

        <div id="lista">
            Carregando...
        </div>

    </div>


</div>


<script>

async function salvarPaciente() {

    const nome =
        document.getElementById("nome").value.trim();

    const cpf =
        document.getElementById("cpf").value.trim();

    const tipo =
        document.getElementById("tipo").value;

    const resultado =
        document.getElementById("resultado");


    if (!nome) {

        resultado.className = "erro";

        resultado.textContent =
            "Digite o nome do paciente.";

        return;
    }


    try {

        const resposta =
            await fetch("/paciente", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    nome,
                    cpf,
                    tipo
                })

            });


        const data =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                data.erro ||
                "Erro ao cadastrar paciente."
            );

        }


        resultado.className =
            "sucesso";

        resultado.textContent =
            "✅ Paciente cadastrado com sucesso!";


        document.getElementById("nome").value = "";

        document.getElementById("cpf").value = "";

        document.getElementById("tipo").value = "";


        carregarPacientes();

    }

    catch (erro) {

        resultado.className = "erro";

        resultado.textContent =
            "❌ " + erro.message;

    }

}


async function carregarPacientes() {

    const lista =
        document.getElementById("lista");


    try {

        const resposta =
            await fetch("/pacientes");


        const pacientes =
            await resposta.json();


        lista.innerHTML = "";


        if (!pacientes.length) {

            lista.innerHTML =
                "<p>Nenhum paciente cadastrado.</p>";

            return;
        }


        pacientes.forEach(paciente => {

            const item =
                document.createElement("div");

            item.className =
                "fila-item";


            item.innerHTML = `

                <div>

                    <strong>
                        ${escapeHTML(
                            paciente.nome ||
                            "Paciente"
                        )}
                    </strong>

                    <br>

                    <small>

                        CPF:
                        ${escapeHTML(
                            paciente.cpf ||
                            "Não informado"
                        )}

                    </small>

                </div>

            `;


            lista.appendChild(item);

        });

    }

    catch (erro) {

        lista.innerHTML =
            "<p class='erro'>Erro ao carregar pacientes.</p>";

    }

}


function escapeHTML(texto) {

    return String(texto)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


carregarPacientes();

setInterval(
    carregarPacientes,
    5000
);

</script>

</body>
</html>
