<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico - Saúde Integra</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="painel-header">

        <div>

            <h2>
                🩺 Painel Médico
            </h2>

            <p>
                Pacientes aguardando atendimento
            </p>

        </div>

        <div>

            <button
                onclick="window.open('tv.html', '_blank')"
            >
                📺 Abrir TV
            </button>

            <a
                href="index.html"
                class="btn-voltar"
            >
                Sair
            </a>

        </div>

    </div>


    <div class="consultorio">

        <strong>
            Meu consultório:
        </strong>

        <input
            id="consultorio"
            value="01"
            maxlength="4"
        >

    </div>


    <div id="triagens">
        Carregando...
    </div>


    <hr>


    <h3>
        📋 Consulta
    </h3>


    <input
        id="pacienteId"
        type="hidden"
    >


    <input
        id="paciente"
        placeholder="Paciente"
        readonly
    >


    <input
        id="diagnostico"
        placeholder="Diagnóstico"
    >


    <select id="medicacao">

        <option value="">
            Selecione a medicação
        </option>

    </select>


    <textarea
        id="obs"
        placeholder="Observações"
    ></textarea>


    <button onclick="salvarConsulta()">
        💾 Finalizar Consulta
    </button>


    <div id="resultado"></div>

</div>


<script>

let triagens = [];


// ======================================================
// CARREGAR TRIAGENS
// ======================================================

async function carregarTriagens() {

    const div =
        document.getElementById("triagens");


    try {

        const resposta =
            await fetch("/triagens");


        triagens =
            await resposta.json();


        if (triagens.length === 0) {

            div.innerHTML =
                "<p>Nenhum paciente aguardando médico.</p>";

            return;
        }


        div.innerHTML = "";


        triagens.forEach((t, index) => {

            const card =
                document.createElement("div");


            card.className = "card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(t.nome)}
                </h3>

                <p>
                    <strong>Sintoma:</strong>
                    ${escapeHTML(t.sintoma || "Não informado")}
                </p>

                <p>
                    <strong>Temperatura:</strong>
                    ${t.temperatura ?? "Não informada"} °C
                </p>

                <p>
                    <strong>Alergia:</strong>
                    ${escapeHTML(t.alergia || "Nenhuma")}
                </p>

                <p>
                    <strong>Observação:</strong>
                    ${escapeHTML(t.observacao || "Nenhuma")}
                </p>

                <p>
                    <span class="${t.risco}">
                        ${escapeHTML(t.risco)}
                    </span>
                </p>

                <button
                    onclick="selecionar(${index})"
                >
                    Atender
                </button>

                <button
                    class="btn-tv"
                    onclick="chamarTV(${index})"
                >
                    📺 Chamar na TV
                </button>
            `;


            div.appendChild(card);
        });


    } catch (erro) {

        div.innerHTML =
            "<p class='erro'>Erro ao carregar triagens.</p>";
    }
}


// ======================================================
// SELECIONAR
// ======================================================

function selecionar(index) {

    const t =
        triagens[index];


    document.getElementById(
        "pacienteId"
    ).value = t.pacienteId;


    document.getElementById(
        "paciente"
    ).value = t.nome;


    document.getElementById(
        "obs"
    ).value = t.observacao || "";


    if (
        t.alergia &&
        t.alergia.toLowerCase() !==
        "nenhuma"
    ) {

        alert(
            "⚠️ Atenção: alergia registrada: " +
            t.alergia
        );
    }
}


// ======================================================
// CHAMAR NA TV
// ======================================================

async function chamarTV(index) {

    const t =
        triagens[index];


    const consultorio =
        document.getElementById(
            "consultorio"
        ).value || "01";


    try {

        const resposta =
            await fetch("/tv/chamar", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    localTipo:
                        "CONSULTÓRIO",

                    localNumero:
                        consultorio,

                    paciente:
                        t.nome
                })
            });


        if (!resposta.ok) {

            throw new Error(
                "Não foi possível chamar."
            );
        }


        alert(
            "📺 " +
            t.nome +
            " chamado para o Consultório " +
            consultorio
        );


    } catch (erro) {

        alert(
            "❌ Erro ao chamar paciente."
        );
    }
}


// ======================================================
// CARREGAR MEDICAÇÕES
// ======================================================

async function carregarMedicacoes() {

    const select =
        document.getElementById(
            "medicacao"
        );


    const resposta =
        await fetch(
            "/lista-medicacoes"
        );


    const medicamentos =
        await resposta.json();


    select.innerHTML =
        '<option value="">Selecione a medicação</option>';


    medicamentos.forEach(med => {

        const option =
            document.createElement(
                "option"
            );

        option.value = med;

        option.textContent = med;

        select.appendChild(option);
    });
}


// ======================================================
// SALVAR CONSULTA
// ======================================================

async function salvarConsulta() {

    const pacienteId =
        document.getElementById(
            "pacienteId"
        ).value;


    const paciente =
        document.getElementById(
            "paciente"
        ).value;


    const diagnostico =
        document.getElementById(
            "diagnostico"
        ).value.trim();


    const medicacao =
        document.getElementById(
            "medicacao"
        ).value;


    const obs =
        document.getElementById(
            "obs"
        ).value;


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!pacienteId) {

        resultado.className = "erro";

        resultado.textContent =
            "Selecione um paciente.";

        return;
    }


    try {

        const resposta =
            await fetch("/consulta", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    pacienteId,
                    paciente,
                    diagnostico,
                    medicacao,
                    obs

                })
            });


        const data =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                data.erro ||
                "Erro ao salvar consulta"
            );
        }


        resultado.className =
            "sucesso";

        resultado.textContent =
            "✅ Consulta finalizada com sucesso!";


        limparConsulta();

        carregarTriagens();


    } catch (erro) {

        resultado.className =
            "erro";

        resultado.textContent =
            "❌ " + erro.message;
    }
}


// ======================================================
// LIMPAR CONSULTA
// ======================================================

function limparConsulta() {

    document.getElementById(
        "pacienteId"
    ).value = "";

    document.getElementById(
        "paciente"
    ).value = "";

    document.getElementById(
        "diagnostico"
    ).value = "";

    document.getElementById(
        "medicacao"
    ).value = "";

    document.getElementById(
        "obs"
    ).value = "";
}


// ======================================================
// SEGURANÇA HTML
// ======================================================

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


carregarTriagens();

carregarMedicacoes();

setInterval(
    carregarTriagens,
    5000
);

</script>

</body>
</html>
