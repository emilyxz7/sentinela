<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Médico - Saúde Integra</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="container">


    <header class="painel-header">

        <div>

            <h2>
                👨‍⚕️ Painel Médico
            </h2>

            <p>
                Atendimento médico dos pacientes
            </p>

        </div>


        <a
            href="index.html"
            class="btn-voltar"
        >
            ← Voltar
        </a>

    </header>


    <nav class="menu">

        <a href="index.html">🏠 Início</a>

        <a href="atendimento.html">📝 Atendimento</a>

        <a href="triagem.html">🩺 Triagem</a>

        <a href="medico.html">👨‍⚕️ Médico</a>

        <a href="medicacoes.html">💊 Medicações</a>

        <a href="alta.html">📋 Alta</a>

        <a href="tv.html" target="_blank">📺 Painel TV</a>

    </nav>


    <div class="consultorio">

        <strong>
            🏥 Consultório:
        </strong>

        <input
            id="consultorio"
            value="01"
        >

    </div>


    <div class="card">

        <h3>
            👥 Pacientes aguardando atendimento
        </h3>

        <div id="triagens">
            Carregando...
        </div>

    </div>


    <div class="card">

        <h3>
            📋 Registrar consulta
        </h3>


        <input
            id="pacienteId"
            type="hidden"
        >


        <label>
            Paciente
        </label>

        <input
            id="paciente"
            readonly
        >


        <label>
            Diagnóstico
        </label>

        <input
            id="diagnostico"
            placeholder="Digite o diagnóstico"
        >


        <label>
            Medicação
        </label>

        <select id="medicacao">

            <option value="">
                Selecione uma medicação
            </option>

        </select>


        <label>
            Observações
        </label>

        <textarea
            id="obs"
            placeholder="Observações da consulta..."
        ></textarea>


        <button onclick="salvarConsulta()">

            💾 Finalizar consulta

        </button>


        <div id="resultado"></div>

    </div>


</div>


<script>

let triagens = [];


async function carregarTriagens() {

    const div =
        document.getElementById(
            "triagens"
        );


    try {

        const resposta =
            await fetch("/triagens");


        triagens =
            await resposta.json();


        div.innerHTML = "";


        if (!triagens.length) {

            div.innerHTML =
                "<p>Nenhum paciente aguardando médico.</p>";

            return;
        }


        triagens.forEach(
            (triagem, index) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "fila-item";


                card.innerHTML = `

                    <div>

                        <strong>
                            ${escapeHTML(
                                triagem.nome ||
                                triagem.paciente ||
                                "Paciente"
                            )}
                        </strong>

                        <br>

                        <small>

                            Sintomas:
                            ${escapeHTML(
                                triagem.sintoma ||
                                "Não informado"
                            )}

                        </small>

                    </div>

                `;


                const atender =
                    document.createElement(
                        "button"
                    );


                atender.textContent =
                    "🩺 Atender";


                atender.onclick =
                    () => selecionar(index);


                const chamar =
                    document.createElement(
                        "button"
                    );


                chamar.textContent =
                    "📺 Chamar";


                chamar.onclick =
                    () => chamarTV(index);


                card.appendChild(
                    atender
                );

                card.appendChild(
                    chamar
                );


                div.appendChild(
                    card
                );

            }
        );

    }

    catch (erro) {

        div.innerHTML =
            "<p class='erro'>Erro ao carregar triagens.</p>";

    }

}


function selecionar(index) {

    const paciente =
        triagens[index];


    document.getElementById(
        "pacienteId"
    ).value =
        paciente.pacienteId ||
        paciente.id;


    document.getElementById(
        "paciente"
    ).value =
        paciente.nome ||
        paciente.paciente ||
        "";

}


async function chamarTV(index) {

    const paciente =
        triagens[index];


    const consultorio =
        document.getElementById(
            "consultorio"
        ).value;


    try {

        const resposta =
            await fetch(
                "/tv/chamar",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            localTipo:
                                "CONSULTÓRIO",

                            localNumero:
                                consultorio,

                            paciente:
                                paciente.nome ||
                                paciente.paciente

                        })

                }
            );


        const data =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                data.erro ||
                "Erro ao chamar paciente."
            );

        }


        alert(
            "📺 Paciente chamado para o consultório " +
            consultorio
        );

    }

    catch (erro) {

        alert(
            "❌ " + erro.message
        );

    }

}


async function carregarMedicacoes() {

    const select =
        document.getElementById(
            "medicacao"
        );


    try {

        const resposta =
            await fetch(
                "/lista-medicacoes"
            );


        const medicamentos =
            await resposta.json();


        medicamentos.forEach(
            medicamento => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    medicamento;

                option.textContent =
                    medicamento;

                select.appendChild(
                    option
                );

            }
        );

    }

    catch (erro) {

        console.error(erro);

    }

}


async function salvarConsulta() {

    const pacienteId =
        document.getElementById(
            "pacienteId"
        ).value;


    const paciente =
        document.getElementById(
            "paciente"
        ).value;


    const diagnostico =
        document.getElementById(
            "diagnostico"
        ).value;


    const medicacao =
        document.getElementById(
            "medicacao"
        ).value;


    const obs =
        document.getElementById(
            "obs"
        ).value;


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!pacienteId) {

        resultado.className =
            "erro";

        resultado.textContent =
            "Selecione um paciente.";

        return;
    }


    try {

        const resposta =
            await fetch(
                "/consulta",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            pacienteId,

                            paciente,

                            diagnostico,

                            medicacao,

                            obs

                        })

                }
            );


        const data =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                data.erro ||
                "Erro ao registrar consulta."
            );

        }


        resultado.className =
            "sucesso";

        resultado.textContent =
            "✅ Consulta registrada com sucesso!";


        document.getElementById(
            "pacienteId"
        ).value = "";

        document.getElementById(
            "paciente"
        ).value = "";

        document.getElementById(
            "diagnostico"
        ).value = "";

        document.getElementById(
            "medicacao"
        ).value = "";

        document.getElementById(
            "obs"
        ).value = "";


        carregarTriagens();

    }

    catch (erro) {

        resultado.className =
            "erro";

        resultado.textContent =
            "❌ " + erro.message;

    }

}


function escapeHTML(texto) {

    return String(texto)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


carregarTriagens();

carregarMedicacoes();

setInterval(
    carregarTriagens,
    5000
);

</script>

</body>
</html>
