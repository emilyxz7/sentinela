<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Médico - Saúde Integra</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- ==============================
         CABEÇALHO
    =============================== -->

    <div class="painel-header">

        <div>

            <h2>🩺 Painel Médico</h2>

            <p>
                Pacientes aguardando atendimento
            </p>

        </div>


        <div>

            <button
                type="button"
                onclick="window.open('tv.html', '_blank')"
            >
                📺 Abrir TV
            </button>


            <a
                href="index.html"
                class="btn-voltar"
            >
                Sair
            </a>

        </div>

    </div>



    <!-- ==============================
         CONSULTÓRIO
    =============================== -->

    <div class="consultorio">

        <strong>
            Meu consultório:
        </strong>


        <input
            id="consultorio"
            value="01"
            maxlength="4"
        >

    </div>



    <!-- ==============================
         TRIAGENS
    =============================== -->

    <div id="triagens">

        Carregando...

    </div>



    <hr>



    <!-- ==============================
         CONSULTA
    =============================== -->

    <h3>
        📋 Consulta
    </h3>


    <input
        id="pacienteId"
        type="hidden"
    >


    <input
        id="paciente"
        placeholder="Paciente"
        readonly
    >


    <input
        id="diagnostico"
        placeholder="Diagnóstico"
    >


    <select id="medicacao">

        <option value="">
            Selecione a medicação
        </option>

    </select>


    <textarea
        id="obs"
        placeholder="Observações"
    ></textarea>


    <button
        type="button"
        onclick="salvarConsulta()"
    >
        💾 Finalizar Consulta
    </button>


    <div id="resultado"></div>


</div>



<script>

/* =========================================
   VARIÁVEIS
========================================= */

let triagens = [];



/* =========================================
   FUNÇÃO AUXILIAR PARA REQUISIÇÕES
========================================= */

async function obterJSON(url, opcoes = {}) {

    const resposta = await fetch(url, opcoes);

    const texto = await resposta.text();

    let dados = {};

    try {

        dados = texto
            ? JSON.parse(texto)
            : {};

    } catch {

        dados = {
            erro: texto || "Resposta inválida do servidor."
        };

    }


    if (!resposta.ok) {

        throw new Error(
            dados.erro ||
            `Erro HTTP ${resposta.status}`
        );

    }


    return dados;

}



/* =========================================
   CARREGAR TRIAGENS
========================================= */

async function carregarTriagens() {

    const div =
        document.getElementById("triagens");


    try {

        const dados =
            await obterJSON("/triagens");


        triagens =
            Array.isArray(dados)
                ? dados
                : [];


        if (triagens.length === 0) {

            div.innerHTML = `
                <div class="card">
                    <p>
                        Nenhum paciente aguardando médico.
                    </p>
                </div>
            `;

            return;

        }


        div.innerHTML = "";


        triagens.forEach((t, index) => {

            const card =
                document.createElement("div");


            card.className = "card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(t.nome || "Paciente")}
                </h3>

                <p>
                    <strong>Sintoma:</strong>
                    ${escapeHTML(
                        t.sintoma || "Não informado"
                    )}
                </p>

                <p>
                    <strong>Temperatura:</strong>
                    ${
                        t.temperatura !== undefined &&
                        t.temperatura !== null &&
                        t.temperatura !== ""
                            ? escapeHTML(t.temperatura)
                            : "Não informada"
                    } °C
                </p>

                <p>
                    <strong>Alergia:</strong>
                    ${escapeHTML(
                        t.alergia || "Nenhuma"
                    )}
                </p>

                <p>
                    <strong>Observação:</strong>
                    ${escapeHTML(
                        t.observacao || "Nenhuma"
                    )}
                </p>

                <p>
                    <span class="${classeRisco(t.risco)}">
                        ${escapeHTML(
                            t.risco || "Não classificado"
                        )}
                    </span>
                </p>


                <button
                    type="button"
                    onclick="selecionar(${index})"
                >
                    Atender
                </button>


                <button
                    type="button"
                    class="btn-tv"
                    onclick="chamarTV(${index})"
                >
                    📺 Chamar na TV
                </button>

            `;


            div.appendChild(card);

        });


    } catch (erro) {

        console.error(erro);


        div.innerHTML = `
            <div class="card erro">
                ❌ Erro ao carregar os pacientes.
                <br>
                <small>${escapeHTML(erro.message)}</small>
            </div>
        `;

    }

}



/* =========================================
   SELECIONAR PACIENTE
========================================= */

function selecionar(index) {

    const paciente =
        triagens[index];


    if (!paciente) {

        return;

    }


    document.getElementById(
        "pacienteId"
    ).value =
        paciente.pacienteId || paciente.id || "";


    document.getElementById(
        "paciente"
    ).value =
        paciente.nome || "";


    document.getElementById(
        "obs"
    ).value =
        paciente.observacao || "";


    if (
        paciente.alergia &&
        paciente.alergia.toLowerCase() !== "nenhuma"
    ) {

        alert(
            "⚠️ Atenção!\n\n" +
            "Alergia registrada: " +
            paciente.alergia
        );

    }


    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}



/* =========================================
   CHAMAR PACIENTE NA TV
========================================= */

async function chamarTV(index) {

    const paciente =
        triagens[index];


    if (!paciente) {

        return;

    }


    const consultorio =
        document.getElementById(
            "consultorio"
        ).value.trim() || "01";


    try {

        await obterJSON(
            "/tv/chamar",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    localTipo:
                        "CONSULTÓRIO",

                    localNumero:
                        consultorio,

                    paciente:
                        paciente.nome

                })

            }
        );


        alert(
            "📺 " +
            paciente.nome +
            " chamado para o Consultório " +
            consultorio
        );


    } catch (erro) {

        console.error(erro);


        alert(
            "❌ Não foi possível chamar o paciente.\n\n" +
            erro.message
        );

    }

}



/* =========================================
   CARREGAR MEDICAÇÕES
========================================= */

async function carregarMedicacoes() {

    const select =
        document.getElementById(
            "medicacao"
        );


    try {

        const medicamentos =
            await obterJSON(
                "/lista-medicacoes"
            );


        select.innerHTML =
            `<option value="">
                Selecione a medicação
            </option>`;


        if (!Array.isArray(medicamentos)) {

            return;

        }


        medicamentos.forEach(medicamento => {

            const option =
                document.createElement("option");


            option.value =
                medicamento;


            option.textContent =
                medicamento;


            select.appendChild(option);

        });


    } catch (erro) {

        console.error(erro);


        select.innerHTML =
            `<option value="">
                Erro ao carregar medicações
            </option>`;

    }

}



/* =========================================
   SALVAR CONSULTA
========================================= */

async function salvarConsulta() {

    const pacienteId =
        document.getElementById(
            "pacienteId"
        ).value;


    const paciente =
        document.getElementById(
            "paciente"
        ).value;


    const diagnostico =
        document.getElementById(
            "diagnostico"
        ).value.trim();


    const medicacao =
        document.getElementById(
            "medicacao"
        ).value;


    const obs =
        document.getElementById(
            "obs"
        ).value;


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!pacienteId) {

        resultado.className =
            "erro";


        resultado.textContent =
            "Selecione um paciente.";


        return;

    }


    try {

        await obterJSON(
            "/consulta",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    pacienteId,

                    paciente,

                    diagnostico,

                    medicacao,

                    obs

                })

            }
        );


        resultado.className =
            "sucesso";


        resultado.textContent =
            "✅ Consulta finalizada com sucesso!";


        limparConsulta();


        await carregarTriagens();


    } catch (erro) {

        console.error(erro);


        resultado.className =
            "erro";


        resultado.textContent =
            "❌ " + erro.message;

    }

}



/* =========================================
   LIMPAR CONSULTA
========================================= */

function limparConsulta() {

    document.getElementById(
        "pacienteId"
    ).value = "";


    document.getElementById(
        "paciente"
    ).value = "";


    document.getElementById(
        "diagnostico"
    ).value = "";


    document.getElementById(
        "medicacao"
    ).value = "";


    document.getElementById(
        "obs"
    ).value = "";

}



/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}



/* =========================================
   CLASSE DE RISCO
========================================= */

function classeRisco(risco) {

    const valor =
        String(risco || "")
            .toLowerCase();


    if (
        valor.includes("vermelho")
    ) {

        return "vermelho";

    }


    if (
        valor.includes("amarelo")
    ) {

        return "amarelo";

    }


    if (
        valor.includes("verde")
    ) {

        return "verde";

    }


    return "";

}



/* =========================================
   INICIAR
========================================= */

carregarTriagens();

carregarMedicacoes();


setInterval(
    carregarTriagens,
    5000
);

</script>


</body>
</html>
