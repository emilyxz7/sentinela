<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Saúde Integra - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #003b73 0%,
                    #0066b3 50%,
                    #00a6d6 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
        }


        .login-box {
            background: white;

            border-radius: 20px;

            padding: 40px 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            text-align: center;
        }


        .logo {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #0066b3,
                    #00a6d6
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 48px;

            box-shadow:
                0 8px 20px
                rgba(0, 102, 179, 0.30);
        }


        h1 {
            color: #004b87;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .subtitulo {
            color: #777;

            font-size: 15px;

            margin-bottom: 30px;
        }


        .campo {
            text-align: left;

            margin-bottom: 18px;
        }


        .campo label {
            display: block;

            color: #333;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .campo input {
            width: 100%;

            height: 48px;

            border: 1px solid #d2dbe5;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        .campo input:focus {
            border-color: #0074c8;

            box-shadow:
                0 0 0 3px
                rgba(0, 116, 200, 0.12);
        }


        .btn-entrar {
            width: 100%;

            height: 50px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #005ca8,
                    #008fd1
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .btn-entrar:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(0, 92, 168, 0.30);
        }


        .btn-entrar:active {
            transform: translateY(0);
        }


        #mensagem {
            min-height: 22px;

            margin-top: 15px;

            font-size: 14px;
        }


        .erro {
            color: #d62828;
        }


        .sucesso {
            color: #198754;
        }


        .rodape {
            margin-top: 25px;

            color: #888;

            font-size: 12px;

            line-height: 1.5;
        }


        @media (max-width: 480px) {

            .login-box {
                padding: 32px 25px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="logo">
            🏥
        </div>


        <h1>
            Saúde Integra
        </h1>


        <p class="subtitulo">
            Sistema de Gestão e Atendimento em Saúde
        </p>


        <form onsubmit="entrar(event)">


            <div class="campo">

                <label for="usuario">
                    Usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-entrar"
            >
                Entrar
            </button>


        </form>


        <div id="mensagem"></div>


        <div class="rodape">

            Saúde Integra<br>

            Sistema de Gestão Hospitalar

        </div>


    </div>


</div>


<script>

function entrar(event) {

    event.preventDefault();

    const usuario =
        document.getElementById("usuario").value.trim();

    const senha =
        document.getElementById("senha").value;

    const mensagem =
        document.getElementById("mensagem");


    if (
        usuario === "triagem" &&
        senha === "123"
    ) {

        mensagem.className = "sucesso";

        mensagem.textContent =
            "✅ Login realizado com sucesso!";


        setTimeout(() => {

            window.location.href =
                "triagem.html";

        }, 500);


    } else {

        mensagem.className = "erro";

        mensagem.textContent =
            "❌ Usuário ou senha incorretos.";

    }

}

</script>


</body>

</html>
