CTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saúde Integra - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #003b73,
                    #0066b3,
                    #00a6d6
                );
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 40px 35px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #0066b3,
                    #00a6d6
                );

            font-size: 48px;
        }

        h1 {
            color: #004b87;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 30px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input {
            margin: 0;
            height: 48px;
        }

        .btn-entrar {
            width: 100%;
            background:
                linear-gradient(
                    135deg,
                    #005ca8,
                    #008fd1
                );
        }

        #mensagem {
            min-height: 22px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🏥
    </div>

    <h1>Saúde Integra</h1>

    <p class="subtitulo">
        Sistema de Gestão e Atendimento em Saúde
    </p>

    <form id="loginForm">

        <div class="campo">

            <label for="usuario">
                Usuário
            </label>

            <input
                id="usuario"
                autocomplete="username"
                placeholder="Digite seu usuário"
                required
            >

        </div>

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                id="senha"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
                required
            >

        </div>

        <button
            class="btn-entrar"
            type="submit"
        >
            Entrar
        </button>

    </form>

    <div id="mensagem"></div>

</div>


<script>

const form =
    document.getElementById("loginForm");

const mensagem =
    document.getElementById("mensagem");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const usuario =
            document.getElementById("usuario")
                .value.trim();

        const senha =
            document.getElementById("senha")
                .value;


        mensagem.className = "";
        mensagem.textContent =
            "Entrando...";


        try {

            const resposta =
                await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        usuario,
                        senha
                    })
                });


            const data =
                await resposta.json();


            if (!resposta.ok) {
                throw new Error(
                    data.erro ||
                    "Login inválido"
                );
            }


            localStorage.setItem(
                "usuario",
                usuario
            );

            localStorage.setItem(
                "tipo",
                data.tipo
            );


            mensagem.className =
                "sucesso";

            mensagem.textContent =
                "Login realizado com sucesso!";


            setTimeout(() => {

                if (
                    data.tipo ===
                    "atendimento"
                ) {

                    location.href =
                        "atendimento.html";

                } else if (
                    data.tipo ===
                    "triagem"
                ) {

                    location.href =
                        "triagem.html";

                } else if (
                    data.tipo ===
                    "medico"
                ) {

                    location.href =
                        "medico.html";

                }

            }, 400);

        } catch (erro) {

            mensagem.className =
                "erro";

            mensagem.textContent =
                "❌ " + erro.message;
        }
    }
);

</script>

</body>
</html>
