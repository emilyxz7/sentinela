<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV - Saúde Integra</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <style>

        /* =====================================================
           PAINEL TV
        ====================================================== */

        body {
            margin: 0;
            overflow: hidden;
        }


        .tv-container {

            min-height: 100vh;

            padding: 25px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(0, 190, 255, .35),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #001f4d,
                    #003b73 45%,
                    #0066cc
                );

            display: grid;

            grid-template-columns:
                34% 66%;

            gap: 25px;

            color: #18324a;

        }


        .tv-left,
        .tv-right {

            display: flex;

            flex-direction: column;

            gap: 25px;

            min-width: 0;

        }


        .tv-box {

            background: #ffffff;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 15px 40px
                rgba(0, 25, 70, .35);

            border:
                1px solid
                rgba(255,255,255,.4);

        }


        /* =====================================================
           TÍTULOS
        ====================================================== */

        .tv-title {

            background:
                linear-gradient(
                    135deg,
                    #003b73,
                    #0066cc,
                    #0088ee
                );

            color: white;

            padding: 20px 24px;

            font-size: 22px;

            font-weight: bold;

            letter-spacing: .5px;

            text-align: center;

        }


        /* =====================================================
           LOCAL
        ====================================================== */

        .local-box {

            text-align: center;

        }


        #local-tipo {

            color: #0066cc;

            font-size: 28px;

            font-weight: bold;

            margin-top: 35px;

            letter-spacing: 1px;

        }


        #local-numero {

            color: #003b73;

            font-size: 90px;

            line-height: 1;

            font-weight: 900;

            padding: 25px 20px 40px;

            text-shadow:
                0 3px 10px
                rgba(0, 70, 150, .15);

        }


        /* =====================================================
           PACIENTE
        ====================================================== */

        .patient-box {

            flex: 1;

            display: flex;

            flex-direction: column;

        }


        #patient-name {

            flex: 1;

            min-height: 280px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #003b73;

            font-size: clamp(
                45px,
                6vw,
                90px
            );

            font-weight: 900;

            padding: 30px;

            line-height: 1.05;

            text-transform: uppercase;

        }


        /* =====================================================
           HISTÓRICO
        ====================================================== */

        .history-box {

            flex: 1;

            min-height: 0;

        }


        #history-list {

            list-style: none;

            padding: 20px;

            margin: 0;

        }


        #history-list li {

            background:
                linear-gradient(
                    90deg,
                    #eef8ff,
                    #ffffff
                );

            color: #003b73;

            border-left:
                7px solid
                #0066cc;

            padding: 17px;

            margin-bottom: 12px;

            border-radius: 10px;

            font-size: 19px;

            font-weight: bold;

            box-shadow:
                0 4px 12px
                rgba(0, 80, 160, .08);

        }


        #history-list li:last-child {

            margin-bottom: 0;

        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo-box {

            text-align: center;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #eef8ff
                );

        }


        .logo-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #003b73,
                    #0088ee
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 48px;

            box-shadow:
                0 8px 25px
                rgba(0, 90, 180, .3);

        }


        .logo-box h2 {

            color: #003b73;

            font-size: 30px;

            margin: 5px 0;

        }


        .logo-box p {

            color: #64748b;

            margin: 0;

            font-size: 17px;

        }


        /* =====================================================
           ANIMAÇÃO DE CHAMADA
        ====================================================== */

        .chamada-ativa {

            animation:
                destaquePaciente
                1s ease-in-out 3;

        }


        @keyframes destaquePaciente {

            0% {
                background: #ffffff;
            }

            50% {
                background: #d9efff;
            }

            100% {
                background: #ffffff;
            }

        }


        /* =====================================================
           INDICADOR
        ====================================================== */

        .status-painel {

            position: fixed;

            right: 25px;

            bottom: 20px;

            background:
                rgba(0, 59, 115, .9);

            color: white;

            padding: 9px 15px;

            border-radius: 20px;

            font-size: 13px;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.2);

        }


        .status-ponto {

            display: inline-block;

            width: 9px;

            height: 9px;

            background: #35e879;

            border-radius: 50%;

            margin-right: 7px;

            box-shadow:
                0 0 8px
                #35e879;

        }


        /* =====================================================
           RESPONSIVO
        ====================================================== */

        @media (max-width: 1000px) {

            body {
                overflow: auto;
            }


            .tv-container {

                grid-template-columns: 1fr;

                min-height: 100vh;

            }


            #patient-name {

                min-height: 220px;

                font-size: 55px;

            }

        }


        @media (max-width: 600px) {

            .tv-container {

                padding: 12px;

                gap: 12px;

            }


            .tv-left,
            .tv-right {

                gap: 12px;

            }


            .tv-title {

                font-size: 17px;

                padding: 15px;

            }


            #local-tipo {

                font-size: 21px;

                margin-top: 25px;

            }


            #local-numero {

                font-size: 65px;

                padding: 20px;

            }


            #patient-name {

                min-height: 180px;

                font-size: 38px;

            }


            #history-list li {

                font-size: 15px;

                padding: 12px;

            }


            .logo-box {

                padding: 20px;

            }


            .logo-box h2 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="tv-container">


    <!-- =====================================================
         LADO ESQUERDO
    ====================================================== -->

    <div class="tv-left">


        <!-- LOCAL -->

        <div class="tv-box local-box">

            <div class="tv-title">

                📍 LOCAL DE ATENDIMENTO

            </div>


            <div id="local-tipo">

                CONSULTÓRIO

            </div>


            <div id="local-numero">

                --

            </div>

        </div>


        <!-- HISTÓRICO -->

        <div class="tv-box history-box">

            <div class="tv-title">

                📋 ÚLTIMAS CHAMADAS

            </div>


            <ul id="history-list">

                <li>
                    Nenhuma chamada realizada.
                </li>

            </ul>

        </div>


    </div>


    <!-- =====================================================
         LADO DIREITO
    ====================================================== -->

    <div class="tv-right">


        <!-- PACIENTE -->

        <div
            class="tv-box patient-box"
            id="patient-box"
        >

            <div class="tv-title">

                👤 PACIENTE

            </div>


            <div id="patient-name">

                AGUARDANDO...

            </div>

        </div>


        <!-- LOGO -->

        <div class="tv-box logo-box">

            <div class="logo-icon">

                🏥

            </div>


            <h2>

                Saúde Integra

            </h2>


            <p>

                Sistema Hospitalar Integrado

            </p>

        </div>


    </div>


</div>


<!-- =====================================================
     STATUS
====================================================== -->

<div class="status-painel">

    <span class="status-ponto"></span>

    Painel conectado

</div>


<script>


/* =========================================================
   VARIÁVEIS
========================================================= */

let ultimoId = null;


/* =========================================================
   ATUALIZAR PAINEL
========================================================= */

async function atualizarPainel() {


    try {


        const resposta =
            await fetch(
                "/tv/chamada",
                {
                    cache: "no-store"
                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Servidor indisponível"
            );

        }


        const data =
            await resposta.json();


        const chamada =
            data.chamada;


        const historico =
            Array.isArray(
                data.historico
            )
                ? data.historico
                : [];


        /* =================================================
           CHAMADA ATUAL
        ================================================== */

        if (chamada) {


            const tipo =
                chamada.localTipo ||
                "CONSULTÓRIO";


            const numero =
                chamada.localNumero ||
                "--";


            const paciente =
                chamada.paciente ||
                "AGUARDANDO...";


            document.getElementById(
                "local-tipo"
            ).textContent =
                tipo;


            document.getElementById(
                "local-numero"
            ).textContent =
                numero;


            document.getElementById(
                "patient-name"
            ).textContent =
                paciente;


            /* ---------------------------------------------
               NOVA CHAMADA
            ---------------------------------------------- */

            if (
                chamada.id !==
                ultimoId
            ) {


                ultimoId =
                    chamada.id;


                destacarPaciente();


                falarChamada(
                    paciente,
                    tipo,
                    numero
                );

            }

        }


        /* =================================================
           HISTÓRICO
        ================================================== */

        atualizarHistorico(
            historico
        );

    }


    catch (erro) {

        console.error(
            "Erro no painel:",
            erro
        );

    }

}


/* =========================================================
   ATUALIZAR HISTÓRICO
========================================================= */

function atualizarHistorico(
    historico
) {


    const lista =
        document.getElementById(
            "history-list"
        );


    lista.innerHTML =
        "";


    const ultimas =
        historico.slice(
            0,
            5
        );


    if (!ultimas.length) {

        const li =
            document.createElement(
                "li"
            );


        li.textContent =
            "Nenhuma chamada realizada.";


        lista.appendChild(
            li
        );


        return;

    }


    ultimas.forEach(
        chamada => {


            const li =
                document.createElement(
                    "li"
                );


            const paciente =
                chamada.paciente ||
                "Paciente";


            const tipo =
                chamada.localTipo ||
                "CONSULTÓRIO";


            const numero =
                chamada.localNumero ||
                "";


            li.textContent =

                `${paciente} — ` +
                `${tipo} ${numero}`;


            lista.appendChild(
                li
            );

        }
    );

}


/* =========================================================
   DESTACAR PACIENTE
========================================================= */

function destacarPaciente() {


    const box =
        document.getElementById(
            "patient-box"
        );


    box.classList.remove(
        "chamada-ativa"
    );


    /* Força reinício da animação */

    void box.offsetWidth;


    box.classList.add(
        "chamada-ativa"
    );

}


/* =========================================================
   FALAR CHAMADA
========================================================= */

function falarChamada(
    paciente,
    tipo,
    numero
) {


    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const texto =

        `Atenção. ` +

        `Paciente ${paciente}. ` +

        `Comparecer ao ` +

        `${tipo || "consultório"} ` +

        `${numero || ""}.`;


    const fala =
        new SpeechSynthesisUtterance(
            texto
        );


    fala.lang =
        "pt-BR";


    fala.rate =
        0.9;


    fala.pitch =
        1;


    fala.volume =
        1;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        fala
    );

}


/* =========================================================
   INICIAR
========================================================= */

atualizarPainel();


/* =========================================================
   ATUALIZA A CADA 2 SEGUNDOS
========================================================= */

setInterval(
    atualizarPainel,
    2000
);


</script>


</body>

</html>
