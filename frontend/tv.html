<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV - Saúde Integra</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

</head>


<body>


<div class="tv-container">


    <div class="tv-left">


        <div class="tv-box local-box">

            <div class="tv-title">

                📍 LOCAL DE ATENDIMENTO

            </div>


            <div id="local-tipo">

                CONSULTÓRIO

            </div>


            <div id="local-numero">

                --

            </div>

        </div>


        <div class="tv-box history-box">

            <div class="tv-title">

                📋 ÚLTIMAS CHAMADAS

            </div>


            <ul id="history-list"></ul>

        </div>


    </div>



    <div class="tv-right">


        <div class="tv-box patient-box">

            <div class="tv-title">

                👤 PACIENTE

            </div>


            <div id="patient-name">

                AGUARDANDO...

            </div>

        </div>


        <div class="tv-box logo-box">

            <div style="font-size:50px;">
                🏥
            </div>

            <h2>
                Saúde Integra
            </h2>

            <p>
                Sistema Hospitalar Integrado
            </p>

        </div>


    </div>


</div>


<script>

let ultimoId = null;


async function atualizarPainel() {

    try {

        const resposta =
            await fetch(
                "/tv/chamada"
            );


        const data =
            await resposta.json();


        const chamada =
            data.chamada;


        const historico =
            data.historico || [];


        if (chamada) {

            document.getElementById(
                "local-tipo"
            ).textContent =
                chamada.localTipo ||
                "CONSULTÓRIO";


            document.getElementById(
                "local-numero"
            ).textContent =
                chamada.localNumero ||
                "--";


            document.getElementById(
                "patient-name"
            ).textContent =
                chamada.paciente ||
                "AGUARDANDO...";


            if (
                chamada.id !==
                ultimoId
            ) {

                ultimoId =
                    chamada.id;


                falarChamada(
                    chamada.paciente,
                    chamada.localTipo,
                    chamada.localNumero
                );

            }

        }


        const lista =
            document.getElementById(
                "history-list"
            );


        lista.innerHTML = "";


        historico
            .slice(0, 5)
            .forEach(
                chamadaHistorico => {

                    const li =
                        document.createElement(
                            "li"
                        );


                    li.textContent =

                        `${chamadaHistorico.paciente || ""} - ` +

                        `${chamadaHistorico.localTipo || "CONSULTÓRIO"} ` +

                        `${chamadaHistorico.localNumero || ""}`;


                    lista.appendChild(
                        li
                    );

                }
            );

    }

    catch (erro) {

        console.error(
            "Erro no painel:",
            erro
        );

    }

}


function falarChamada(
    paciente,
    tipo,
    numero
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const texto =

        `Atenção. Paciente ${paciente}. ` +

        `Comparecer ao ${tipo || "consultório"} ` +

        `${numero || ""}.`;


    const fala =
        new SpeechSynthesisUtterance(
            texto
        );


    fala.lang = "pt-BR";

    fala.rate = 0.9;

    fala.pitch = 1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        fala
    );

}


atualizarPainel();


setInterval(
    atualizarPainel,
    2000
);

</script>


</body>

</html>
