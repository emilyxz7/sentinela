<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Saúde Integra | Painel de Chamada
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="tv-body">


<div class="tv-container">


    <!-- ================================================
         COLUNA ESQUERDA
    ================================================= -->

    <div class="tv-column">


        <!-- LOCAL -->
        <section class="tv-card tv-local">

            <div class="tv-title">
                📢 CHAMADA
            </div>


            <div
                id="local-tipo"
                class="tv-local-type"
            >
                CONSULTÓRIO
            </div>


            <div
                id="local-numero"
                class="tv-local-number"
            >
                --
            </div>

        </section>



        <!-- HISTÓRICO -->
        <section class="tv-card">

            <div class="tv-title">
                Últimas chamadas
            </div>


            <div
                id="historico"
                class="tv-history"
            >

                <div class="tv-history-item">
                    Aguardando chamadas...
                </div>

            </div>

        </section>


    </div>



    <!-- ================================================
         COLUNA DIREITA
    ================================================= -->

    <div class="tv-column">


        <section class="tv-card tv-patient">


            <div class="tv-title">

                🏥 SAÚDE INTEGRA

            </div>


            <div
                id="paciente"
                class="tv-patient-name"
            >

                AGUARDANDO

            </div>


        </section>


    </div>


</div>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const localTipo =
    document.getElementById(
        "local-tipo"
    );


const localNumero =
    document.getElementById(
        "local-numero"
    );


const paciente =
    document.getElementById(
        "paciente"
    );


const historico =
    document.getElementById(
        "historico"
    );



/* =====================================================
   HISTÓRICO
===================================================== */

let chamadasAnteriores = [];



/* =====================================================
   CARREGAR CHAMADA
===================================================== */

async function carregarChamada() {

    try {

        const resposta =
            await fetch(
                "/tv/chamada"
            );


        if (!resposta.ok) {

            return;

        }


        const dados =
            await resposta.json();


        if (!dados) {

            return;

        }


        const nome =
            dados.paciente ||
            dados.nome ||
            "AGUARDANDO";


        const tipo =
            dados.localTipo ||
            dados.tipo ||
            "CONSULTÓRIO";


        const numero =
            dados.localNumero ||
            dados.numero ||
            "--";


        localTipo.textContent =
            tipo;


        localNumero.textContent =
            numero;


        paciente.textContent =
            nome;


        adicionarHistorico({

            nome:
                nome,

            local:
                `${tipo} ${numero}`

        });


    } catch (erro) {

        console.error(
            "Erro no painel:",
            erro
        );

    }

}



/* =====================================================
   HISTÓRICO
===================================================== */

function adicionarHistorico(
    chamada
) {

    if (
        !chamada.nome ||
        chamada.nome === "AGUARDANDO"
    ) {

        return;

    }


    const ultima =
        chamadasAnteriores[0];


    if (
        ultima &&
        ultima.nome === chamada.nome &&
        ultima.local === chamada.local
    ) {

        return;

    }


    chamadasAnteriores.unshift(
        chamada
    );


    chamadasAnteriores =
        chamadasAnteriores.slice(
            0,
            5
        );


    historico.innerHTML =
        "";


    chamadasAnteriores.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "tv-history-item";


            div.textContent =
                `${item.nome} — ${item.local}`;


            historico.appendChild(
                div
            );

        }
    );

}



/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

carregarChamada();


setInterval(
    carregarChamada,
    2000
);

</script>


</body>
</html>
