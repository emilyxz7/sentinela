<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Triagem - Saúde Integra</title>

<link rel="stylesheet" href="style.css">

<style>

/* ============================= */
/* CONFIGURAÇÃO GERAL */
/* ============================= */

body {
    background: #eaf4ff;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 30px;
    color: #183b56;
}


/* ============================= */
/* CONTAINER PRINCIPAL */
/* ============================= */

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0, 91, 160, 0.12);
}


/* ============================= */
/* CABEÇALHO */
/* ============================= */

.cabecalho {
    background: linear-gradient(
        135deg,
        #0077cc,
        #005bb5
    );

    color: white;

    padding: 22px;

    border-radius: 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

    box-shadow:
        0 5px 15px rgba(0, 91, 181, 0.25);
}


.cabecalho h2 {
    margin: 0;
    font-size: 24px;
}


.cabecalho p {
    margin: 5px 0 0;
    opacity: 0.9;
    font-size: 14px;
}


/* ============================= */
/* BOTÃO DA TV */
/* ============================= */

.btn-abrir-tv {

    background: white;

    color: #006dcc;

    border: none;

    padding: 10px 16px;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.btn-abrir-tv:hover {

    background: #e8f4ff;

    transform: translateY(-1px);

}


/* ============================= */
/* ÁREA DA FILA */
/* ============================= */

.pacientes-fila {

    margin-bottom: 30px;

    background: #eaf5ff;

    border-radius: 12px;

    padding: 20px;

    border: 1px solid #c7e3fa;

}


.pacientes-fila h3 {

    margin-top: 0;

    color: #075b96;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

}


.pacientes-fila h3 span {

    font-size: 12px;

    font-weight: normal;

    color: #5d7890;

}


/* ============================= */
/* PACIENTE NA FILA */
/* ============================= */

.fila-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: white;

    border-radius: 9px;

    padding: 14px 16px;

    margin-bottom: 9px;

    border: 1px solid #d2e7f7;

    box-shadow:
        0 2px 5px rgba(0, 80, 140, 0.06);

}


.fila-item strong {

    font-size: 16px;

    color: #174a6b;

}


.fila-item small {

    color: #78909c;

    font-size: 12px;

}


/* ============================= */
/* BOTÃO CHAMAR TV */
/* ============================= */

.btn-tv {

    background: #0088dd;

    color: white;

    border: none;

    padding: 9px 14px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    font-weight: bold;

    margin-left: 8px;

}


.btn-tv:hover {

    background: #006fba;

}


/* ============================= */
/* TÍTULOS */
/* ============================= */

.formulario-titulo {

    color: #075b96;

    border-left: 5px solid #0088dd;

    padding-left: 10px;

    margin-top: 25px;

}


/* ============================= */
/* CAMPOS */
/* ============================= */

input,
select,
textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 12px;

    margin-bottom: 14px;

    border: 1px solid #c8ddec;

    border-radius: 8px;

    background: #fafdff;

    color: #234;

    font-size: 14px;

    outline: none;

}


input:focus,
select:focus,
textarea:focus {

    border-color: #0088dd;

    box-shadow:
        0 0 0 3px rgba(0, 136, 221, 0.10);

}


textarea {

    min-height: 100px;

    resize: vertical;

}


/* ============================= */
/* BOTÃO SALVAR */
/* ============================= */

.btn-salvar {

    width: 100%;

    background: linear-gradient(
        135deg,
        #0088dd,
        #006ac6
    );

    color: white;

    border: none;

    padding: 14px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    transition: 0.2s;

}


.btn-salvar:hover {

    background: linear-gradient(
        135deg,
        #0077c8,
        #005bb0
    );

    transform: translateY(-1px);

}


/* ============================= */
/* RESULTADO */
/* ============================= */

#resultado {

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 15px;

    text-align: center;

    font-weight: bold;

}


#resultado.verde {

    background: #dff7e8;

    color: #198754;

}


#resultado.amarelo {

    background: #fff3cd;

    color: #946200;

}


#resultado.vermelho {

    background: #ffe1e1;

    color: #c62828;

}


/* ============================= */
/* LINHA */
/* ============================= */

hr {

    border: none;

    border-top: 1px solid #dcecf8;

    margin: 25px 0;

}


/* ============================= */
/* BOTÃO ATUALIZAR */
/* ============================= */

.btn-atualizar {

    margin-top: 8px;

    background: #5b9bd5;

    color: white;

    border: none;

    padding: 7px 13px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 13px;

}


.btn-atualizar:hover {

    background: #4387c2;

}


/* ============================= */
/* CELULAR */
/* ============================= */

@media (max-width: 650px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .cabecalho {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .pacientes-fila h3 {
        flex-direction: column;
        align-items: flex-start;
    }

    .fila-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .btn-tv {
        margin-left: 0;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ============================= -->
<!-- CABEÇALHO -->
<!-- ============================= -->

<div class="cabecalho">

    <div>

        <h2>
            🏥 Saúde Integra
        </h2>

        <p>
            Sistema de Triagem Hospitalar
        </p>

    </div>


    <button
        class="btn-abrir-tv"
        onclick="abrirTV()"
    >

        📺 Abrir Tela da TV

    </button>

</div>



<!-- ============================= -->
<!-- FILA -->
<!-- ============================= -->

<div class="pacientes-fila">


    <h3>

        👥 Pacientes Cadastrados

        <span>
            Clique em "Chamar na TV" para chamar ao guichê
        </span>

    </h3>


    <div id="fila-pacientes">

        <p style="color:#78909c; text-align:center;">

            Carregando...

        </p>

    </div>


    <button
        class="btn-atualizar"
        onclick="carregarPacientes()"
    >

        🔄 Atualizar lista

    </button>


</div>



<hr>



<!-- ============================= -->
<!-- FORMULÁRIO -->
<!-- ============================= -->

<h3 class="formulario-titulo">

    🩺 Formulário de Triagem

</h3>


<input
    id="nome"
    placeholder="Nome do paciente"
>


<select id="sintoma">

    <option value="">
        Selecione o sintoma
    </option>

    <option value="dor_leve">
        Dor leve
    </option>

    <option value="resfriado">
        Resfriado
    </option>

    <option value="coriza">
        Coriza
    </option>

    <option value="tosse">
        Tosse
    </option>

    <option value="febre">
        Febre
    </option>

    <option value="vomito">
        Vômito
    </option>

    <option value="diarreia">
        Diarreia
    </option>

    <option value="falta_ar_moderada">
        Falta de ar moderada
    </option>

    <option value="falta_ar_grave">
        Falta de ar grave
    </option>

    <option value="infarto">
        Suspeita de infarto
    </option>

    <option value="avc">
        Suspeita de AVC
    </option>

    <option value="convulsao">
        Convulsão
    </option>

    <option value="hemorragia">
        Hemorragia
    </option>

</select>


<input
    id="temp"
    type="number"
    placeholder="Temperatura"
/>


<input
    id="alergia"
    placeholder="Alergias"
/>


<textarea
    id="observacao"
    placeholder="Observações"
></textarea>


<div id="resultado"></div>


<button
    class="btn-salvar"
    onclick="salvar()"
>

    💾 Salvar Triagem

</button>


</div>



<script>


/* ============================= */
/* ABRIR TV */
/* ============================= */

function abrirTV() {

    window.open(
        "/tv.html",
        "_blank"
    );

}



/* ============================= */
/* CARREGAR PACIENTES */
/* ============================= */

function carregarPacientes() {

    fetch("/pacientes")

    .then(r => r.json())

    .then(pacientes => {

        const div =
            document.getElementById(
                "fila-pacientes"
            );


        const fila =
            pacientes.filter(
                p => p.status === "triagem"
            );


        if (fila.length === 0) {

            div.innerHTML =
                "<p style='color:#78909c; text-align:center;'>Nenhum paciente aguardando.</p>";

            return;

        }


        div.innerHTML = "";


        fila.forEach(p => {

            const item =
                document.createElement("div");


            item.className =
                "fila-item";


            item.innerHTML = `

                <div>

                    <strong>
                        ${p.nome}
                    </strong>

                    <br>

                    <small>
                        CPF: ${p.cpf || "—"}
                        |
                        Tipo: ${p.tipo || "—"}
                    </small>

                </div>


                <button
                    class="btn-tv"
                    onclick="chamarNaTV('${p.nome}')"
                >

                    📺 Chamar na TV

                </button>

            `;


            div.appendChild(item);

        });

    })


    .catch(() => {

        document.getElementById(
            "fila-pacientes"
        ).innerHTML =

            "<p style='color:red; text-align:center;'>Erro ao carregar pacientes.</p>";

    });

}



/* ============================= */
/* CHAMAR NA TV */
/* ============================= */

function chamarNaTV(nome) {

    fetch("/tv/chamar", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            localTipo: "GUICHÊ",

            localNumero: "01",

            paciente: nome

        })

    })


    .then(r => r.json())


    .then(() => {

        alert(
            "✅ " +
            nome +
            " foi chamado na TV para o Guichê 01!"
        );

    });

}



/* ============================= */
/* CLASSIFICAR RISCO */
/* ============================= */

function classificarRisco(
    sintoma,
    temperatura
) {

    const vermelhos = [

        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"

    ];


    const amarelos = [

        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"

    ];


    if (temperatura >= 39)
        return "vermelho";


    if (vermelhos.includes(sintoma))
        return "vermelho";


    if (amarelos.includes(sintoma))
        return "amarelo";


    return "verde";

}



/* ============================= */
/* SALVAR */
/* ============================= */

function salvar() {

    const nome =
        document.getElementById(
            "nome"
        ).value;


    const sintoma =
        document.getElementById(
            "sintoma"
        ).value;


    const temperatura =
        Number(
            document.getElementById(
                "temp"
            ).value
        );


    const alergia =
        document.getElementById(
            "alergia"
        ).value;


    const observacao =
        document.getElementById(
            "observacao"
        ).value;


    const risco =
        classificarRisco(
            sintoma,
            temperatura
        );


    fetch("/triagem", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            nome,
            sintoma,
            temperatura,
            alergia,
            observacao,
            risco

        })

    })


    .then(r => r.json())


    .then(() => {

        const resultado =
            document.getElementById(
                "resultado"
            );


        resultado.className =
            risco;


        resultado.innerHTML =
            "Classificação: " +
            risco.toUpperCase();


        alert(
            "Triagem salva com sucesso!"
        );

    });

}



/* ============================= */
/* INICIAR */
/* ============================= */

carregarPacientes();


setInterval(
    carregarPacientes,
    10000
);


</script>


</body>

</html>
