<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triagem - Saúde Integra</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- ==============================
         TOPO
    =============================== -->

    <div class="topo">

        <div>

            <h2>
                🏥 Saúde Integra
            </h2>

            <p>
                Sistema de Triagem Hospitalar
            </p>

        </div>


        <a
            href="index.html"
            class="btn-voltar"
        >
            Sair
        </a>

    </div>



    <!-- ==============================
         FILA
    =============================== -->

    <div class="card">

        <h3>
            👥 Pacientes aguardando triagem
        </h3>


        <div id="fila">

            Carregando...

        </div>

    </div>



    <hr>



    <!-- ==============================
         FORMULÁRIO
    =============================== -->

    <h3>
        🩺 Formulário de Triagem
    </h3>


    <input
        id="pacienteId"
        type="hidden"
    >


    <input
        id="nome"
        placeholder="Nome do paciente"
        readonly
    >


    <select id="sintoma">

        <option value="">
            Selecione o sintoma
        </option>

        <option value="dor_leve">
            Dor leve
        </option>

        <option value="resfriado">
            Resfriado
        </option>

        <option value="coriza">
            Coriza
        </option>

        <option value="tosse">
            Tosse
        </option>

        <option value="febre">
            Febre
        </option>

        <option value="vomito">
            Vômito
        </option>

        <option value="diarreia">
            Diarreia
        </option>

        <option value="falta_ar_moderada">
            Falta de ar moderada
        </option>

        <option value="falta_ar_grave">
            Falta de ar grave
        </option>

        <option value="infarto">
            Suspeita de infarto
        </option>

        <option value="avc">
            Suspeita de AVC
        </option>

        <option value="convulsao">
            Convulsão
        </option>

        <option value="hemorragia">
            Hemorragia
        </option>

    </select>


    <input
        id="temperatura"
        type="number"
        step="0.1"
        placeholder="Temperatura °C"
    >


    <input
        id="alergia"
        placeholder="Alergias"
    >


    <textarea
        id="observacao"
        placeholder="Observações"
    ></textarea>


    <button
        type="button"
        onclick="salvarTriagem()"
    >
        💾 Salvar Triagem
    </button>


    <div id="resultado"></div>


</div>



<script>

/* =========================================
   VARIÁVEIS
========================================= */

let pacientes = [];



/* =========================================
   REQUISIÇÃO
========================================= */

async function obterJSON(url, opcoes = {}) {

    const resposta =
        await fetch(url, opcoes);


    const texto =
        await resposta.text();


    let dados = {};


    try {

        dados =
            texto
                ? JSON.parse(texto)
                : {};

    } catch {

        dados = {
            erro:
                texto ||
                "Resposta inválida do servidor."
        };

    }


    if (!resposta.ok) {

        throw new Error(
            dados.erro ||
            `Erro HTTP ${resposta.status}`
        );

    }


    return dados;

}



/* =========================================
   CARREGAR PACIENTES
========================================= */

async function carregarPacientes() {

    const fila =
        document.getElementById("fila");


    try {

        const dados =
            await obterJSON("/pacientes");


        pacientes =
            Array.isArray(dados)
                ? dados
                : [];


        const aguardando =
            pacientes.filter(
                p =>
                    p.status === "triagem"
            );


        if (aguardando.length === 0) {

            fila.innerHTML = `
                <p>
                    Nenhum paciente aguardando triagem.
                </p>
            `;

            return;

        }


        fila.innerHTML = "";


        aguardando.forEach(paciente => {

            const div =
                document.createElement("div");


            div.className =
                "fila-item";


            div.innerHTML = `

                <div>

                    <strong>
                        ${escapeHTML(
                            paciente.nome ||
                            "Paciente"
                        )}
                    </strong>

                    <br>

                    <small>

                        CPF:
                        ${escapeHTML(
                            paciente.cpf || "—"
                        )}

                        |

                        ${escapeHTML(
                            paciente.tipo || "—"
                        )}

                    </small>

                </div>


                <button
                    type="button"
                    onclick="selecionarPaciente('${escapeHTML(
                        paciente.id
                    )}')"
                >
                    Atender
                </button>

            `;


            fila.appendChild(div);

        });


    } catch (erro) {

        console.error(erro);


        fila.innerHTML = `
            <p class="erro">
                ❌ Erro ao carregar pacientes.
                <br>
                ${escapeHTML(erro.message)}
            </p>
        `;

    }

}



/* =========================================
   SELECIONAR PACIENTE
========================================= */

function selecionarPaciente(id) {

    const paciente =
        pacientes.find(
            p =>
                String(p.id) === String(id)
        );


    if (!paciente) {

        alert(
            "Paciente não encontrado."
        );

        return;

    }


    document.getElementById(
        "pacienteId"
    ).value =
        paciente.id;


    document.getElementById(
        "nome"
    ).value =
        paciente.nome || "";


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}



/* =========================================
   SALVAR TRIAGEM
========================================= */

async function salvarTriagem() {

    const pacienteId =
        document.getElementById(
            "pacienteId"
        ).value;


    const nome =
        document.getElementById(
            "nome"
        ).value;


    const sintoma =
        document.getElementById(
            "sintoma"
        ).value;


    const temperatura =
        document.getElementById(
            "temperatura"
        ).value;


    const alergia =
        document.getElementById(
            "alergia"
        ).value;


    const observacao =
        document.getElementById(
            "observacao"
        ).value;


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!pacienteId) {

        resultado.className =
            "erro";


        resultado.textContent =
            "Selecione um paciente.";


        return;

    }


    if (!sintoma) {

        resultado.className =
            "erro";


        resultado.textContent =
            "Selecione o sintoma.";


        return;

    }


    try {

        const data =
            await obterJSON(
                "/triagem",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        pacienteId,

                        nome,

                        sintoma,

                        temperatura,

                        alergia,

                        observacao

                    })

                }
            );


        resultado.className =
            classeRisco(data.risco);


        resultado.textContent =
            "Classificação: " +
            String(
                data.risco ||
                "não classificado"
            ).toUpperCase();


        alert(
            "✅ Triagem salva com sucesso!"
        );


        limparFormulario();


        await carregarPacientes();


    } catch (erro) {

        console.error(erro);


        resultado.className =
            "erro";


        resultado.textContent =
            "❌ " +
            erro.message;

    }

}



/* =========================================
   LIMPAR FORMULÁRIO
========================================= */

function limparFormulario() {

    document.getElementById(
        "pacienteId"
    ).value = "";


    document.getElementById(
        "nome"
    ).value = "";


    document.getElementById(
        "sintoma"
    ).value = "";


    document.getElementById(
        "temperatura"
    ).value = "";


    document.getElementById(
        "alergia"
    ).value = "";


    document.getElementById(
        "observacao"
    ).value = "";

}



/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}



/* =========================================
   RISCO
========================================= */

function classeRisco(risco) {

    const valor =
        String(risco || "")
            .toLowerCase();


    if (
        valor.includes("vermelho")
    ) {

        return "vermelho";

    }


    if (
        valor.includes("amarelo")
    ) {

        return "amarelo";

    }


    if (
        valor.includes("verde")
    ) {

        return "verde";

    }


    return "";

}



/* =========================================
   INICIAR
========================================= */

carregarPacientes();


setInterval(
    carregarPacientes,
    5000
);

</script>


</body>
</html>
