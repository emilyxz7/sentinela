<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Triagem - Saúde Integra</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<div class="container">


    <header class="topo">

        <div>

            <h2>🩺 Triagem</h2>

            <p>
                Avaliação inicial do paciente
            </p>

        </div>

        <a
            href="index.html"
            class="btn-voltar"
        >
            ← Voltar
        </a>

    </header>


    <nav class="menu">

        <a href="index.html">🏠 Início</a>

        <a href="atendimento.html">📝 Atendimento</a>

        <a href="triagem.html">🩺 Triagem</a>

        <a href="medico.html">👨‍⚕️ Médico</a>

        <a href="medicacoes.html">💊 Medicações</a>

        <a href="alta.html">📋 Alta</a>

        <a href="tv.html">📺 Painel TV</a>

    </nav>


    <div class="card">

        <h3>
            👥 Pacientes aguardando triagem
        </h3>

        <div id="fila">
            Carregando...
        </div>

    </div>


    <div class="card">

        <h3>
            🩺 Realizar triagem
        </h3>


        <input
            id="pacienteId"
            type="hidden"
        >


        <label>
            Paciente
        </label>

        <input
            id="nome"
            readonly
            placeholder="Selecione um paciente acima"
        >


        <label>
            Sintoma principal
        </label>

        <textarea
            id="sintoma"
            placeholder="Descreva os sintomas..."
        ></textarea>


        <label>
            Pressão arterial
        </label>

        <input
            id="pressao"
            placeholder="Ex.: 120/80"
        >


        <label>
            Temperatura
        </label>

        <input
            id="temperatura"
            type="number"
            step="0.1"
            placeholder="Ex.: 36.5"
        >


        <label>
            Frequência cardíaca
        </label>

        <input
            id="frequencia"
            placeholder="Ex.: 80 bpm"
        >


        <label>
            Saturação
        </label>

        <input
            id="saturacao"
            placeholder="Ex.: 98%"
        >


        <label>
            Observações
        </label>

        <textarea
            id="observacao"
            placeholder="Observações..."
        ></textarea>


        <button onclick="salvarTriagem()">

            💾 Salvar triagem

        </button>


        <div id="resultado"></div>

    </div>


</div>


<script>

let pacientes = [];


async function carregarPacientes() {

    const fila =
        document.getElementById("fila");


    try {

        const resposta =
            await fetch("/pacientes");


        pacientes =
            await resposta.json();


        fila.innerHTML = "";


        if (!pacientes.length) {

            fila.innerHTML =
                "<p>Nenhum paciente aguardando.</p>";

            return;
        }


        pacientes.forEach(paciente => {

            const item =
                document.createElement("div");


            item.className =
                "fila-item";


            const dados =
                document.createElement("div");


            dados.innerHTML = `

                <strong>
                    ${escapeHTML(
                        paciente.nome ||
                        "Paciente"
                    )}
                </strong>

                <br>

                <small>
                    ID:
                    ${escapeHTML(
                        String(
                            paciente.id || ""
                        )
                    )}
                </small>

            `;


            const botao =
                document.createElement("button");


            botao.textContent =
                "Selecionar";


            botao.onclick =
                () => selecionarPaciente(
                    paciente.id
                );


            item.appendChild(dados);

            item.appendChild(botao);

            fila.appendChild(item);

        });

    }

    catch (erro) {

        fila.innerHTML =
            "<p class='erro'>Erro ao carregar pacientes.</p>";

    }

}


function selecionarPaciente(id) {

    const paciente =
        pacientes.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if (!paciente) return;


    document.getElementById(
        "pacienteId"
    ).value = paciente.id;


    document.getElementById(
        "nome"
    ).value = paciente.nome;


}


async function salvarTriagem() {

    const pacienteId =
        document.getElementById(
            "pacienteId"
        ).value;


    const sintoma =
        document.getElementById(
            "sintoma"
        ).value;


    const pressao =
        document.getElementById(
            "pressao"
        ).value;


    const temperatura =
        document.getElementById(
            "temperatura"
        ).value;


    const frequencia =
        document.getElementById(
            "frequencia"
        ).value;


    const saturacao =
        document.getElementById(
            "saturacao"
        ).value;


    const observacao =
        document.getElementById(
            "observacao"
        ).value;


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!pacienteId) {

        resultado.className =
            "erro";

        resultado.textContent =
            "Selecione um paciente.";

        return;
    }


    try {

        const resposta =
            await fetch("/triagem", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    pacienteId,

                    sintoma,

                    pressao,

                    temperatura,

                    frequencia,

                    saturacao,

                    observacao

                })

            });


        const data =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                data.erro ||
                "Erro ao salvar triagem."
            );

        }


        resultado.className =
            "sucesso";

        resultado.textContent =
            "✅ Triagem salva com sucesso!";


        limpar();

        carregarPacientes();

    }

    catch (erro) {

        resultado.className =
            "erro";

        resultado.textContent =
            "❌ " + erro.message;

    }

}


function limpar() {

    document.getElementById(
        "pacienteId"
    ).value = "";

    document.getElementById(
        "nome"
    ).value = "";

    document.getElementById(
        "sintoma"
    ).value = "";

    document.getElementById(
        "pressao"
    ).value = "";

    document.getElementById(
        "temperatura"
    ).value = "";

    document.getElementById(
        "frequencia"
    ).value = "";

    document.getElementById(
        "saturacao"
    ).value = "";

    document.getElementById(
        "observacao"
    ).value = "";

}


function escapeHTML(texto) {

    return String(texto)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


carregarPacientes();

setInterval(
    carregarPacientes,
    5000
);

</script>

</body>
</html>
